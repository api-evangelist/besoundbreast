description: 'BeSound (Besoundbreast) is a women''s-health technology platform offering modern,
  radiation-free breast imaging using ABUS ultrasound to help find cancers that mammograms can miss,
  particularly in women with dense breast tissue. BeSound connects patients with independent partner
  medical groups who deliver the imaging; results reach a secure patient portal within 24-48 weekday
  hours. Screening breast ultrasound is $349, with locations in Los Angeles (Melrose Ave) and Beverly
  Hills. BeSound is a consumer healthcare service and does not currently publish a public developer API,
  SDKs, or developer portal; this profile captures its public identity and the machine-readable llms.txt
  it publishes for AI agents.'
